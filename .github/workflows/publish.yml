name: Release

on:
    push:
        branches:
            - main
            - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write # Required for npm Trusted Publishing (OIDC)

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  # Trusted Publishing needs npm >= 11.5.1 (bundled with Node 24)
                  node-version: 24
                  cache: 'pnpm'
                  # Do not set registry-url: setup-node would write an empty
                  # _authToken line that blocks the OIDC exchange.

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm run test

            - name: Build project
              run: pnpm run build

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v1
              with:
                  # Publishes via OIDC Trusted Publisher — no NPM_TOKEN needed
                  publish: pnpm run release
                  commit: 'chore(release): version packages'
                  title: 'chore(release): version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
